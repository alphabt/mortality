<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1400"
  height="560"
  viewBox="0 0 1400 560"
  role="img"
  aria-label="Mortality counter and life ring"
>
  <defs>
    <radialGradient id="ambient" cx="80%" cy="25%" r="75%">
      <stop offset="0" stop-color="#17455d" stop-opacity="0.9" />
      <stop offset="0.48" stop-color="#102b3e" stop-opacity="0.46" />
      <stop offset="1" stop-color="#0e1b2a" stop-opacity="0" />
    </radialGradient>
    <line
      id="tick"
      x1="1120"
      y1="58"
      x2="1120"
      y2="72"
      stroke="#8398ad"
      stroke-opacity="0.42"
      stroke-width="2"
    />
  </defs>

  <rect width="1400" height="560" fill="#0e1b2a" />
  <rect width="1400" height="560" fill="url(#ambient)" />

  <g fill="none" transform="rotate(-90 1120 280)">
    <circle
      cx="1120"
      cy="280"
      r="190"
      stroke="#294256"
      stroke-width="20"
    />
    <circle
      cx="1120"
      cy="280"
      r="190"
      stroke="#8398ad"
      stroke-opacity="0.5"
      stroke-width="20"
      stroke-dasharray="537.2 1193.8"
