  </g>

  <g>
    <use href="#tick" />
    <use href="#tick" transform="rotate(30 1120 280)" />
    <use href="#tick" transform="rotate(60 1120 280)" />
    <use href="#tick" transform="rotate(90 1120 280)" />
    <use href="#tick" transform="rotate(120 1120 280)" />
    <use href="#tick" transform="rotate(150 1120 280)" />
    <use href="#tick" transform="rotate(180 1120 280)" />
    <use href="#tick" transform="rotate(210 1120 280)" />
    <use href="#tick" transform="rotate(240 1120 280)" />
    <use href="#tick" transform="rotate(270 1120 280)" />
    <use href="#tick" transform="rotate(300 1120 280)" />
    <use href="#tick" transform="rotate(330 1120 280)" />
  </g>

  <text
