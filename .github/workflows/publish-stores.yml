name: "Publish Stores"

# Manual store publishing: re-publish a released tag, ship a subset of stores,
# or recover a single store that failed mid-release. It only accepts an existing
# release asset; branch builds must pass the release workflow's CI gate first.
# Credentials come entirely from repo secrets; see
# .github/skills/publish-to-stores/SKILL.md for the full list and how to get them.

on:
  workflow_dispatch:
    inputs:
      stores:
        description: "Stores to publish: 'all', or a space-separated subset of 'chrome edge firefox'"
        default: "all"
        required: true
      tag:
        description: "Release tag whose built asset to publish (e.g. v1.4.0). Leave blank for the latest release."
        default: ""
        required: false

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      stores: ${{ inputs.stores }}
      tag: ${{ inputs.tag }}
    secrets: inherit
