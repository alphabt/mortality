version: 2
updates:
  # Keep GitHub Actions pinned in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Keep the dev toolchain (vitest, jsdom, prettier) current. Nothing here ships;
  # the extension itself has no runtime dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      dev-dependencies:
        patterns: ["*"]
